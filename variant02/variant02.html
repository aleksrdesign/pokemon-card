<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="variant02.css" />
    <title>Pokédex - Squirtle</title>
  </head>
  <body>
    <div class="pokemon">
      <img src="images/7.png" alt="Squirtle" />
    </div>
    <div class="presentation">
      <h1>Squirtle</h1>
      <div class="badges">
        <span class="badge-water"> Water </span>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Height</span>
          <span class="stat-value">0.5 m</span>
        </div>
        <div class="stat">
          <span class="stat-label">Weight</span>
          <span class="stat-value">9.0 kg</span>
        </div>
        <div class="stat">
          <span class="stat-label">Category</span>
          <span class="stat-value">Tiny Turtle</span>
        </div>
      </div>

      <p class="description">
        Squirtle is a Water-type Pokémon native to the Kanto region. This small,
        turtle-like Pokémon retreats into its sturdy shell whenever it senses
        danger, using the shell's opening as a shield against attacks.
      </p>

      <button class="button">More details</button>
    </div>
  </body>
</html>
