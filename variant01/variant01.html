<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="variant01.css" />
    <title>Pokédex - Charmander</title>
  </head>
  <body>
    <div class="pokemon">
      <img src="images/4.png" alt="Charmender" />
    </div>
    <div class="presentation">
      <h1>Charmander</h1>
      <div class="badges">
        <span class="badge-fire"> Fire </span>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Height</span>
          <span class="stat-value">0.6 m</span>
        </div>
        <div class="stat">
          <span class="stat-label">Weight</span>
          <span class="stat-value">8.5 kg</span>
        </div>
        <div class="stat">
          <span class="stat-label">Category</span>
          <span class="stat-value">Lizard</span>
        </div>
      </div>

      <p class="description">
        Charmander is a Fire-type Pokémon native to the Kanto region. This
        small, bipedal reptile with bright orange scales is instantly
        recognizable by the glowing flame that burns constantly at the tip of
        its tail.
      </p>

      <button class="button">More details</button>
    </div>
  </body>
</html>
