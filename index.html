<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Pokédex</title>
  </head>
  <body>
    <div class="pokeball">
      <img
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
        alt=""
      />
    </div>
    <h1>Pokémon Card</h1>
    <p class="subtitle">Choose a Pokémon</p>

    <div class="list">
      <a href="variant01/variant01.html" class="card card-fire" target="_blank">
        <span class="card-name">Charmander</span>
        <span class="card-type">Fire</span>
      </a>

      <a
        href="variant02/variant02.html"
        class="card card-water"
        target="_blank"
      >
        <span class="card-name">Squirtle</span>
        <span class="card-type">Water</span>
      </a>

      <a
        href="variant03/variant03.html"
        class="card card-grass"
        target="_blank"
      >
        <span class="card-name">Bulbasaur</span>
        <span class="card-type">Grass</span>
      </a>
    </div>

    <p class="note">
      HTML/CSS practice exercise. Pokémon artwork and names are property of
      Nintendo/Game Freak/The Pokémon Company.
    </p>
  </body>
</html>
