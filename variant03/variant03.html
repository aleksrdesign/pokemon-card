<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="variant03.css" />
    <title>Pokédex - Bulbasaur</title>
  </head>
  <body>
    <div class="pokemon">
      <img src="images/1.png" alt="Bulbasaur" />
    </div>
    <div class="presentation">
      <h1>Bulbasaur</h1>
      <div class="badges">
        <span class="badge-grass"> Grass </span>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Height</span>
          <span class="stat-value">0.7 m</span>
        </div>
        <div class="stat">
          <span class="stat-label">Weight</span>
          <span class="stat-value">6.9 kg</span>
        </div>
        <div class="stat">
          <span class="stat-label">Category</span>
          <span class="stat-value">Seed</span>
        </div>
      </div>

      <p class="description">
        Bulbasaur is a Grass-type Pokémon found throughout the Kanto region. A
        bulb grows on its back from the day it is born, gradually swelling as it
        stores nutrients for its later evolutions.
      </p>

      <button class="button">More details</button>
    </div>
  </body>
</html>
